<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Build TypeScript to dist/index.js -->
  <script src="dist/index.js" type="module" defer></script>
</head>
<body>
  <main class="app">
    <h1>My Todo List</h1>

    <form id="container" class="add-form">
      <input id="todo-input" type="text" placeholder="Add a new task..." autocomplete="off" />
      <button type="submit">Add</button>
    </form>

    <div class="bulk-actions">
      <button id="complete-all" type="button" title="Mark all tasks as completed">Complete All</button>
      <button id="incomplete-all" type="button" title="Mark all tasks as incomplete">Incomplete All</button>
      <button id="clear-completed" type="button" title="Delete all completed tasks">Clear Completed</button>
    </div>

    <ul id="list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <div class="filters">
        <button id="filter-all"        type="button" data-filter="all">All</button>
        <button id="filter-active"     type="button" data-filter="active">Active</button>
        <button id="filter-completed"  type="button" data-filter="completed">Completed</button>
      </div>
      <span class="counter"><span id="items-left">0</span> left</span>
    </footer>
  </main>
</body>
</html>
